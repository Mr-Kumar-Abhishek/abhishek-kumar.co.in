<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="350">
  <defs>
    <!-- Light wave marker -->
    <marker id="arrowL" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 -5L10 0L0 5" fill="#f59e0b"/>
    </marker>
    <!-- Electron arrow -->
    <marker id="arrowE" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 -5L10 0L0 5" fill="#3b82f6"/>
    </marker>
    <!-- Ammeter -->
    <g id="ammeter">
      <circle cx="0" cy="0" r="15" fill="#fff" stroke="#111827" stroke-width="2"/>
      <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">μA</text>
    </g>
    <!-- Battery -->
    <g id="battery">
      <line x1="-15" y1="0" x2="-35" y2="0" stroke="#111827" stroke-width="2"/>
      <line x1="15" y1="0" x2="35" y2="0" stroke="#111827" stroke-width="2"/>
      <line x1="-15" y1="-20" x2="-15" y2="20" stroke="#111827" stroke-width="4"/>
      <line x1="-5" y1="-10" x2="-5" y2="10" stroke="#111827" stroke-width="2"/>
      <line x1="5" y1="-20" x2="5" y2="20" stroke="#111827" stroke-width="4"/>
      <line x1="15" y1="-10" x2="15" y2="10" stroke="#111827" stroke-width="2"/>
      <text x="-25" y="-15" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111827">+</text>
      <text x="25" y="-15" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111827">-</text>
    </g>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" rx="10"/>

  <!-- Evacuated Tube -->
  <!-- Cylinder -->
  <path d="M 100 80 Q 80 80 80 100 L 80 200 Q 80 220 100 220 L 400 220 Q 420 220 420 200 L 420 100 Q 420 80 400 80 Z" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2" fill-opacity="0.3"/>
  <text x="250" y="240" font-family="sans-serif" font-size="14" fill="#0369a1" text-anchor="middle">Evacuated Glass Tube</text>

  <!-- Quartz Window -->
  <path d="M 120 80 L 160 80 L 160 75 L 120 75 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
  
  <!-- Photosensitive Plate (Cathode) -->
  <rect x="100" y="110" width="10" height="80" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
  <text x="105" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">C</text>

  <!-- Collector Plate (Anode) -->
  <rect x="390" y="110" width="10" height="80" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <text x="395" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">A</text>

  <!-- Incident Light -->
  <path d="M 180 30 Q 170 45 160 60 Q 150 75 140 90 L 115 130" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowL)"/>
  <path d="M 150 20 Q 140 35 130 50 Q 120 65 110 80 L 105 115" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowL)"/>
  <text x="210" y="40" font-family="sans-serif" font-size="16" fill="#d97706">Light (hν > Φ₀)</text>

  <!-- Emitted Electrons -->
  <g fill="#3b82f6">
    <circle cx="130" cy="130" r="4" />
    <circle cx="160" cy="145" r="4" />
    <circle cx="180" cy="120" r="4" />
    <circle cx="210" cy="160" r="4" />
    <circle cx="250" cy="135" r="4" />
    <circle cx="300" cy="150" r="4" />
    <circle cx="340" cy="170" r="4" />
    <circle cx="360" cy="140" r="4" />
  </g>
  <text x="250" y="120" font-family="sans-serif" font-size="14" fill="#1d4ed8">e⁻</text>
  
  <line x1="140" y1="130" x2="155" y2="130" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowE)"/>
  <line x1="170" y1="145" x2="195" y2="145" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowE)"/>
  <line x1="260" y1="135" x2="285" y2="135" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowE)"/>

  <!-- External Circuit -->
  <!-- Wires -->
  <line x1="105" y1="190" x2="105" y2="300" stroke="#111827" stroke-width="2"/>
  <line x1="395" y1="190" x2="395" y2="300" stroke="#111827" stroke-width="2"/>
  
  <line x1="105" y1="300" x2="180" y2="300" stroke="#111827" stroke-width="2"/>
  <line x1="395" y1="300" x2="320" y2="300" stroke="#111827" stroke-width="2"/>
  
  <!-- Ammeter placement -->
  <use href="#ammeter" x="145" y="300" />
  
  <!-- Voltmeter across the tube -->
  <line x1="105" y1="260" x2="225" y2="260" stroke="#111827" stroke-width="2" stroke-dasharray="2,2"/>
  <line x1="395" y1="260" x2="275" y2="260" stroke="#111827" stroke-width="2" stroke-dasharray="2,2"/>
  <circle cx="250" cy="260" r="15" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="250" y="265" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">V</text>

  <!-- Battery and Rheostat representation -->
  <!-- Note: Battery is drawn with + on left just to provide a retarding/accelerating potential conceptual model. -->
  <use href="#battery" x="250" y="300" />
  
  <text x="250" y="335" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle">Variable Voltage Source</text>
</svg>
