<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="300">
  <defs>
    <marker id="arrow" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 -5L10 0L0 5" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" rx="10"/>

  <!-- Bar Magnet Elements -->
  <!-- North Pole -->
  <rect x="200" y="130" width="100" height="40" fill="#ef4444" stroke="#7f1d1d" stroke-width="2" />
  <text x="250" y="156" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">N</text>
  
  <!-- South Pole -->
  <rect x="100" y="130" width="100" height="40" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2" />
  <text x="150" y="156" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">S</text>

  <!-- Magnetic Field Lines outside -->
  <g fill="none" stroke="#3b82f6" stroke-width="2">
    <!-- Top Lines -->
    <path d="M 280 130 C 280 50, 120 50, 120 130" />
    <path d="M 250 130 C 250 80, 150 80, 150 130" />
    <!-- Bottom Lines -->
    <path d="M 280 170 C 280 250, 120 250, 120 170" />
    <path d="M 250 170 C 250 220, 150 220, 150 170" />
    
    <!-- End emanating lines N -->
    <path d="M 300 140 Q 350 100 380 80" />
    <path d="M 300 150 Q 360 150 380 150" />
    <path d="M 300 160 Q 350 200 380 220" />

    <!-- End converging lines S -->
    <path d="M 20 80 Q 50 100 100 140" />
    <path d="M 20 150 Q 50 150 100 150" />
    <path d="M 20 220 Q 50 200 100 160" />
  </g>

  <!-- Add arrows to paths -->
  <g stroke="#3b82f6" stroke-width="2">
    <line x1="200" y1="83" x2="195" y2="83" marker-end="url(#arrow)"/>
    <line x1="200" y1="101" x2="195" y2="101" marker-end="url(#arrow)"/>
    <line x1="200" y1="217" x2="195" y2="217" marker-end="url(#arrow)"/>
    <line x1="200" y1="199" x2="195" y2="199" marker-end="url(#arrow)"/>

    <line x1="330" y1="110" x2="335" y2="106" marker-end="url(#arrow)"/>
    <line x1="340" y1="150" x2="345" y2="150" marker-end="url(#arrow)"/>
    <line x1="330" y1="190" x2="335" y2="194" marker-end="url(#arrow)"/>

    <line x1="60" y1="110" x2="65" y2="114" marker-end="url(#arrow)"/>
    <line x1="60" y1="150" x2="65" y2="150" marker-end="url(#arrow)"/>
    <line x1="60" y1="190" x2="65" y2="186" marker-end="url(#arrow)"/>
  </g>

</svg>
