<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="300">
  <defs>
    <marker id="arrow" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 -5L10 0L0 5" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" rx="10"/>

  <!-- Core cylinder (optional, hidden or light) -->
  <rect x="100" y="110" width="300" height="80" fill="#e5e7eb" stroke="#d1d5db" rx="10"/>

  <!-- Solenoid Coils -->
  <g fill="none" stroke="#d97706" stroke-width="6">
    <path d="M 120 190 C 130 190, 150 110, 160 110" />
    <path d="M 160 190 C 170 190, 190 110, 200 110" />
    <path d="M 200 190 C 210 190, 230 110, 240 110" />
    <path d="M 240 190 C 250 190, 270 110, 280 110" />
    <path d="M 280 190 C 290 190, 310 110, 320 110" />
    <path d="M 320 190 C 330 190, 350 110, 360 110" />
    <path d="M 360 190 C 370 190, 390 110, 400 110" />
  </g>

  <!-- Back part of coils -->
  <g fill="none" stroke="#b45309" stroke-width="4" stroke-dasharray="4,4">
    <path d="M 160 110 C 150 110, 130 190, 120 190" />
    <path d="M 200 110 C 190 110, 170 190, 160 190" />
    <path d="M 240 110 C 230 110, 210 190, 200 190" />
    <path d="M 280 110 C 270 110, 250 190, 240 190" />
    <path d="M 320 110 C 310 110, 290 190, 280 190" />
    <path d="M 360 110 C 350 110, 330 190, 320 190" />
    <path d="M 400 110 C 390 110, 370 190, 360 190" />
  </g>

  <!-- Terminals -->
  <line x1="80" y1="190" x2="120" y2="190" stroke="#d97706" stroke-width="6" />
  <line x1="400" y1="110" x2="440" y2="110" stroke="#d97706" stroke-width="6" />

  <!-- Current Direction -->
  <text x="90" y="215" font-family="sans-serif" font-size="18" fill="#111827">Current I</text>
  <line x1="80" y1="200" x2="110" y2="200" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Magnetic Field Lines (Internal) -->
  <line x1="50" y1="150" x2="450" y2="150" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="80" y1="130" x2="420" y2="130" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="80" y1="170" x2="420" y2="170" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Magnetic Field Lines (External looping) -->
  <path d="M 450 150 C 450 50, 50 50, 50 150" fill="none" stroke="#ef4444" stroke-width="2" />
  <path d="M 420 130 C 420 80, 80 80, 80 130" fill="none" stroke="#ef4444" stroke-width="2" />

  <path d="M 450 150 C 450 250, 50 250, 50 150" fill="none" stroke="#ef4444" stroke-width="2" />
  <path d="M 420 170 C 420 220, 80 220, 80 170" fill="none" stroke="#ef4444" stroke-width="2" />

  <line x1="250" y1="78" x2="245" y2="78" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="222" x2="255" y2="222" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
