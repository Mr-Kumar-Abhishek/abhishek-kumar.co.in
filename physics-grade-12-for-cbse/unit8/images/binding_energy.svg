<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="350">
  <defs>
    <marker id="arrow" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 -5L10 0L0 5" fill="#111827"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" rx="10"/>

  <g transform="translate(50, 300)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="420" y2="0" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="0" y1="0" x2="0" y2="-280" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
    
    <text x="430" y="5" font-family="sans-serif" font-size="14" fill="#111827">Mass Number (A)</text>
    <text x="-40" y="-290" font-family="sans-serif" font-size="14" fill="#111827">Binding Energy / Nucleon (MeV)</text>
    <text x="-15" y="15" font-family="sans-serif" font-size="14" fill="#111827">0</text>
    
    <!-- Y-axis ticks -->
    <text x="-20" y="-65" font-family="sans-serif" font-size="12" fill="#374151">2</text>
    <text x="-20" y="-135" font-family="sans-serif" font-size="12" fill="#374151">4</text>
    <text x="-20" y="-205" font-family="sans-serif" font-size="12" fill="#374151">6</text>
    <text x="-20" y="-270" font-family="sans-serif" font-size="12" fill="#374151">8</text>

    <!-- X-axis ticks -->
    <text x="80" y="20" font-family="sans-serif" font-size="12" fill="#374151">50</text>
    <text x="160" y="20" font-family="sans-serif" font-size="12" fill="#374151">100</text>
    <text x="240" y="20" font-family="sans-serif" font-size="12" fill="#374151">150</text>
    <text x="320" y="20" font-family="sans-serif" font-size="12" fill="#374151">200</text>
    <text x="400" y="20" font-family="sans-serif" font-size="12" fill="#374151">250</text>

    <!-- Curve for BE/A -->
    <!-- Approximate points: (0,0), (6, -240), (20, -270), (56, -290), (100, -280), (200, -260), (238, -250) -->
    <!-- Note: scaled y = -35 * E. 8MeV = -280 -->
    <path d="M 0 0 Q 5 -100 10 -150 Q 20 -230 40 -250 Q 60 -290 80 -300 Q 120 -295 180 -285 Q 300 -270 380 -255" fill="none" stroke="#2563eb" stroke-width="3" />
    
    <!-- Noteworthy points -->
    <circle cx="85" cy="-298" r="4" fill="#ef4444" />
    <text x="75" y="-305" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef4444">Fe-56 (8.8 MeV)</text>

    <text x="360" y="-265" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef4444">U-238</text>
    <circle cx="380" cy="-255" r="4" fill="#ef4444" />
    
    <!-- Regions -->
    <text x="20" y="-200" font-family="sans-serif" font-size="12" fill="#059669">Fusion</text>
    <line x1="25" y1="-190" x2="50" y2="-190" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)" />

    <text x="330" y="-200" font-family="sans-serif" font-size="12" fill="#d97706">Fission</text>
    <line x1="335" y1="-190" x2="300" y2="-190" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)" />

  </g>
</svg>
