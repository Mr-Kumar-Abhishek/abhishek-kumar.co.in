<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="400">
  <defs>
    <marker id="arrow" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 -5L10 0L0 5" fill="#1f2937"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" rx="10"/>

  <g transform="translate(50, 350)">
    <!-- Y axis (Energy) -->
    <line x1="0" y1="0" x2="0" y2="-300" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
    <text x="-5" y="-310" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#111827">E (eV)</text>
    
    <!-- Energy Levels (Horizontal lines) -->
    <!-- n=1 (-13.6 eV) drawn at y=0 -->
    <line x1="0" y1="0" x2="400" y2="0" stroke="#374151" stroke-width="2" />
    <text x="410" y="5" font-family="sans-serif" font-size="14" fill="#111827">n=1  (-13.6)</text>

    <!-- n=2 (-3.4 eV) difference is 10.2. Let's scale delta E to delta Y -->
    <line x1="0" y1="-150" x2="400" y2="-150" stroke="#374151" stroke-width="2" />
    <text x="410" y="-145" font-family="sans-serif" font-size="14" fill="#111827">n=2  (-3.4)</text>

    <!-- n=3 (-1.51 eV) -->
    <line x1="0" y1="-200" x2="400" y2="-200" stroke="#374151" stroke-width="2" />
    <text x="410" y="-195" font-family="sans-serif" font-size="14" fill="#111827">n=3  (-1.51)</text>

    <!-- n=4 (-0.85 eV) -->
    <line x1="0" y1="-225" x2="400" y2="-225" stroke="#374151" stroke-width="2" />
    <text x="410" y="-220" font-family="sans-serif" font-size="14" fill="#111827">n=4  (-0.85)</text>

    <!-- n=infinity (0 eV) -->
    <line x1="0" y1="-260" x2="400" y2="-260" stroke="#374151" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="410" y="-255" font-family="sans-serif" font-size="14" fill="#111827">n=∞  (0.00)</text>

    <!-- Transitions: Lyman Series (to n=1) -->
    <g stroke="#8b5cf6" stroke-width="2">
      <line x1="50" y1="-150" x2="50" y2="-5" marker-end="url(#arrow)" />
      <line x1="90" y1="-200" x2="90" y2="-5" marker-end="url(#arrow)" />
      <line x1="130" y1="-225" x2="130" y2="-5" marker-end="url(#arrow)" />
    </g>
    <text x="90" y="20" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#8b5cf6">Lyman (UV)</text>

    <!-- Transitions: Balmer Series (to n=2) -->
    <g stroke="#ef4444" stroke-width="2">
      <line x1="200" y1="-200" x2="200" y2="-155" marker-end="url(#arrow)" />
      <line x1="240" y1="-225" x2="240" y2="-155" marker-end="url(#arrow)" />
      <line x1="280" y1="-260" x2="280" y2="-155" marker-end="url(#arrow)" />
    </g>
    <text x="240" y="-130" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ef4444">Balmer (Visible)</text>

    <!-- Transitions: Paschen Series (to n=3) -->
    <g stroke="#f59e0b" stroke-width="2">
      <line x1="330" y1="-225" x2="330" y2="-205" marker-end="url(#arrow)" />
      <line x1="370" y1="-260" x2="370" y2="-205" marker-end="url(#arrow)" />
    </g>
    <text x="350" y="-180" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#f59e0b">Paschen (IR)</text>

  </g>
</svg>
