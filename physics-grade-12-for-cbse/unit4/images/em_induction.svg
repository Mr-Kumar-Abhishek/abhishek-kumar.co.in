<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="300">
  <defs>
    <marker id="arrow" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 -5L10 0L0 5" fill="#111827"/>
    </marker>
    <!-- Galvanometer symbol -->
    <g id="galv">
      <circle cx="0" cy="0" r="20" fill="#fff" stroke="#374151" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#374151">G</text>
    </g>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" rx="10"/>

  <!-- Coil -->
  <g fill="none" stroke="#d97706" stroke-width="4">
    <!-- Coil loops -->
    <path d="M 270 150 C 270 90, 240 90, 240 150" />
    <path d="M 280 150 C 280 90, 250 90, 250 150" />
    <path d="M 290 150 C 290 90, 260 90, 260 150" />
    <path d="M 300 150 C 300 90, 270 90, 270 150" />
    <path d="M 310 150 C 310 90, 280 90, 280 150" />
    <path d="M 320 150 C 320 90, 290 90, 290 150" />
    <path d="M 330 150 C 330 90, 300 90, 300 150" />

    <!-- Back loops (dashed) -->
    <path d="M 240 150 C 240 210, 270 210, 270 150" stroke-dasharray="2,3" stroke-width="2" stroke="#b45309" />
    <path d="M 250 150 C 250 210, 280 210, 280 150" stroke-dasharray="2,3" stroke-width="2" stroke="#b45309" />
    <path d="M 260 150 C 260 210, 290 210, 290 150" stroke-dasharray="2,3" stroke-width="2" stroke="#b45309" />
    <path d="M 270 150 C 270 210, 300 210, 300 150" stroke-dasharray="2,3" stroke-width="2" stroke="#b45309" />
    <path d="M 280 150 C 280 210, 310 210, 310 150" stroke-dasharray="2,3" stroke-width="2" stroke="#b45309" />
    <path d="M 290 150 C 290 210, 320 210, 320 150" stroke-dasharray="2,3" stroke-width="2" stroke="#b45309" />
    <path d="M 300 150 C 300 210, 330 210, 330 150" stroke-dasharray="2,3" stroke-width="2" stroke="#b45309" />
    
    <!-- Wire to galvanometer -->
    <path d="M 270 150 L 220 250 L 260 250" />
    <path d="M 330 150 L 380 250 L 300 250" />
  </g>

  <!-- Galvanometer -->
  <use href="#galv" x="280" y="250" />

  <!-- Magnet -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="80" height="40" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2" />
    <rect x="80" y="0" width="80" height="40" fill="#ef4444" stroke="#7f1d1d" stroke-width="2" />
    <text x="40" y="26" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">S</text>
    <text x="120" y="26" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">N</text>
    
    <!-- Movement Arrow -->
    <line x1="170" y1="20" x2="210" y2="20" stroke="#111827" stroke-width="3" marker-end="url(#arrow)" />
    <text x="180" y="10" font-family="sans-serif" font-size="16" font-style="italic" font-weight="bold">v</text>
  </g>

  <!-- Induced Current Direction Indicator -->
  <path d="M 280 240 Q 285 240 286 245" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  
  <text x="250" y="30" font-family="sans-serif" font-size="18" fill="#111827">Faraday's Law of Induction</text>
</svg>
