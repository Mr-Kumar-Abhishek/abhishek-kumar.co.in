<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="300">
  <defs>
    <marker id="arrow" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 -5L10 0L0 5" fill="#111827"/>
    </marker>
    <marker id="arrowE" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 -5L10 0L0 5" fill="#ef4444"/>
    </marker>
    <marker id="arrowB" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 -5L10 0L0 5" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" rx="10"/>

  <g transform="translate(50, 150)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="400" y2="0" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
    <!-- z-axis (diagonal) -->
    <line x1="0" y1="0" x2="-40" y2="80" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

    <text x="410" y="5" font-family="sans-serif" font-size="16" fill="#111827">x (Direction of Propagation)</text>
    <text x="-15" y="-120" font-family="sans-serif" font-size="16" fill="#111827">y</text>
    <text x="-45" y="95" font-family="sans-serif" font-size="16" fill="#111827">z</text>

    <!-- E Field (y-direction) Red -->
    <path d="M 0 0 C 60 -150, 120 -150, 180 0 C 240 150, 300 150, 360 0" fill="none" stroke="#ef4444" stroke-width="3" />
    
    <!-- B Field (z-direction drawn slanted) Blue -->
    <!-- M 0 0 -> x=0, y=0. Peaks on z occur where E peaks. z peak drawn at slope -x/2 for visual -->
    <!-- First peak at x=90, E goes up, B goes out (+z) -> diag down-left from x-axis. -->
    <path d="M 0 0 C 50 80, 130 80, 180 0 C 230 -80, 310 -80, 360 0" fill="none" stroke="#3b82f6" stroke-width="3" />

    <!-- E Field Vectors -->
    <!-- First half wave -->
    <line x1="45" y1="0" x2="45" y2="-80" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowE)" />
    <line x1="90" y1="0" x2="90" y2="-112" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowE)" />
    <line x1="135" y1="0" x2="135" y2="-80" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowE)" />
    <!-- Second half wave -->
    <line x1="225" y1="0" x2="225" y2="80" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowE)" />
    <line x1="270" y1="0" x2="270" y2="112" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowE)" />
    <line x1="315" y1="0" x2="315" y2="80" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowE)" />

    <!-- B Field Vectors -->
    <!-- First half wave (outwards/down) -->
    <line x1="45" y1="0" x2="30" y2="40" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)" />
    <line x1="90" y1="0" x2="65" y2="60" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)" />
    <line x1="135" y1="0" x2="120" y2="40" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)" />
    <!-- Second half wave (inwards/up) -->
    <line x1="225" y1="0" x2="240" y2="-40" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)" />
    <line x1="270" y1="0" x2="295" y2="-60" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)" />
    <line x1="315" y1="0" x2="330" y2="-40" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)" />

    <!-- Labels -->
    <text x="100" y="-120" font-family="sans-serif" font-size="18" fill="#ef4444" font-weight="bold">E</text>
    <text x="45" y="80" font-family="sans-serif" font-size="18" fill="#3b82f6" font-weight="bold">B</text>
  </g>
</svg>
