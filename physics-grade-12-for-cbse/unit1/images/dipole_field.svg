<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 480 300" width="100%" height="300">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
        markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
    <!-- Reverse arrow marker for negative charge lines entering -->
    <marker id="arrow-rev" viewBox="0 0 10 10" refX="2" refY="5"
        markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 5 L 10 10 L 10 0 z" fill="#333" />
    </marker>
  </defs>

  <rect x="-40" width="480" height="100%" fill="#f9fafb" rx="10"/>
  
  <g fill="none" stroke="#333" stroke-width="1.5">
    <!-- Connecting middle lines -->
    <path d="M 150 150 Q 200 100 250 150" marker-mid="url(#arrow)" />
    <path d="M 150 150 L 250 150" marker-mid="url(#arrow)"/>
    <path d="M 150 150 Q 200 200 250 150" marker-mid="url(#arrow)" />

    <!-- External looping lines from positive charge -->
    <path d="M 150 150 Q 150 0 200 0" marker-end="url(#arrow)"/>
    <path d="M 150 150 Q 150 300 200 300" marker-end="url(#arrow)"/>
    
    <path d="M 150 150 Q 50 50 0 100" marker-end="url(#arrow)" />
    <path d="M 150 150 Q 50 250 0 200" marker-end="url(#arrow)" />
    <path d="M 150 150 L 50 150" marker-end="url(#arrow)"/>

    <!-- External looping lines to negative charge -->
    <path d="M 200 0 Q 250 0 250 150" marker-end="url(#arrow)"/>
    <path d="M 200 300 Q 250 300 250 150" marker-end="url(#arrow)"/>

    <path d="M 400 100 Q 350 50 250 150" marker-end="url(#arrow)" />
    <path d="M 400 200 Q 350 250 250 150" marker-end="url(#arrow)" />
    <path d="M 400 150 L 250 150" marker-end="url(#arrow)"/>
  </g>

  <!-- Positive Charge -->
  <circle cx="150" cy="150" r="15" fill="#ef4444" />
  <text x="150" y="155" fill="#fff" font-size="20" font-family="sans-serif" text-anchor="middle" font-weight="bold">+</text>

  <!-- Negative Charge -->
  <circle cx="250" cy="150" r="15" fill="#3b82f6" />
  <text x="250" y="153" fill="#fff" font-size="20" font-family="sans-serif" text-anchor="middle" font-weight="bold">-</text>
</svg>
