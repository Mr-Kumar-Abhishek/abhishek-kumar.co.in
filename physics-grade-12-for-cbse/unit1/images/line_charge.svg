<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="400">
  <defs>
    <marker id="arrow-field" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 -5L10 0L0 5" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" rx="10"/>

  <!-- Cylindrical Gaussian Surface -->
  <ellipse cx="150" cy="100" rx="60" ry="15" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,5"/>
  <ellipse cx="150" cy="300" rx="60" ry="15" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="90" y1="100" x2="90" y2="300" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,5" />
  <line x1="210" y1="100" x2="210" y2="300" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,5" />

  <!-- The Infinitely Long Wire -->
  <line x1="150" y1="20" x2="150" y2="380" stroke="#ef4444" stroke-width="4" />
  
  <!-- Charges on the wire -->
  <text x="150" y="60" font-family="sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="150" y="110" font-family="sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="150" y="160" font-family="sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="150" y="210" font-family="sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="150" y="260" font-family="sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="150" y="310" font-family="sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="150" y="360" font-family="sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">+</text>

  <!-- Electric Field Vectors radially outwards -->
  <g stroke="#4b5563" stroke-width="2">
    <line x1="150" y1="200" x2="210" y2="200" marker-end="url(#arrow-field)"/>
    <line x1="150" y1="200" x2="90" y2="200" marker-end="url(#arrow-field)" />
    <!-- Diagonal fields -->
    <line x1="150" y1="200" x2="190" y2="160" marker-end="url(#arrow-field)" />
    <line x1="150" y1="200" x2="110" y2="160" marker-end="url(#arrow-field)" />
    <line x1="150" y1="200" x2="190" y2="240" marker-end="url(#arrow-field)" />
    <line x1="150" y1="200" x2="110" y2="240" marker-end="url(#arrow-field)" />
  </g>

  <!-- Labels -->
  <text x="220" y="205" font-family="sans-serif" font-size="16" fill="#111827">E</text>
  <!-- Radius r -->
  <line x1="150" y1="280" x2="210" y2="280" stroke="#374151" stroke-width="1.5" />
  <text x="175" y="275" font-family="sans-serif" font-size="14" fill="#374151">r</text>
  
  <text x="70" y="295" font-family="sans-serif" font-size="14" fill="#6b7280" transform="rotate(-90, 70, 295)">Length l</text>
</svg>
