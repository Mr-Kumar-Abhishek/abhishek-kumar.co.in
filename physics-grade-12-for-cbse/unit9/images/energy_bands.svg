<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="300">
  <defs>
    <style>
      .band { stroke: #374151; stroke-width: 2; rx: 5; }
      .text-title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #111827; text-anchor: middle; }
      .text-label { font-family: sans-serif; font-size: 14px; fill: #374151; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" rx="10"/>

  <!-- Energy Axis -->
  <line x1="40" y1="260" x2="40" y2="40" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
  <text x="35" y="30" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="end">Energy (E)</text>
  <path d="M35 40 L40 30 L45 40 Z" fill="#111827" /> <!-- Manual arrow head -->

  <!-- Conductors -->
  <g transform="translate(100, 0)">
    <text x="50" y="280" class="text-title">Conductor</text>
    <rect x="0" y="80" width="100" height="90" fill="#bae6fd" class="band" />
    <rect x="0" y="150" width="100" height="90" fill="#fca5a5" class="band" />
    <!-- Overlap text -->
    <text x="50" y="145" class="text-label" font-weight="bold">Overlap</text>
    <text x="50" y="165" class="text-label" font-weight="bold">Region</text>
    
    <text x="140" y="110" class="text-label" transform="rotate(-90 140 110)">Conduction Band</text>
    <text x="-10" y="210" class="text-label" transform="rotate(-90 -10 210)">Valence Band</text>
  </g>

  <!-- Insulators -->
  <g transform="translate(280, 0)">
    <text x="50" y="280" class="text-title">Insulator</text>
    <rect x="0" y="60" width="100" height="50" fill="#bae6fd" class="band" />
    <text x="50" y="90" class="text-label">CB (Empty)</text>
    
    <!-- Large Band Gap -->
    <line x1="50" y1="110" x2="50" y2="200" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" />
    <text x="120" y="155" class="text-label" fill="#ef4444" font-weight="bold">E_g &gt; 3 eV</text>
    
    <rect x="0" y="200" width="100" height="50" fill="#fca5a5" class="band" />
    <text x="50" y="230" class="text-label">VB (Full)</text>

    <!-- Small dots for electrons in VB -->
    <circle cx="20" cy="215" r="3" fill="#111827"/><circle cx="40" cy="215" r="3" fill="#111827"/><circle cx="60" cy="215" r="3" fill="#111827"/><circle cx="80" cy="215" r="3" fill="#111827"/>
    <circle cx="20" cy="235" r="3" fill="#111827"/><circle cx="40" cy="235" r="3" fill="#111827"/><circle cx="60" cy="235" r="3" fill="#111827"/><circle cx="80" cy="235" r="3" fill="#111827"/>
  </g>

  <!-- Semiconductors -->
  <g transform="translate(460, 0)">
    <text x="50" y="280" class="text-title">Semiconductor</text>
    <rect x="0" y="60" width="100" height="70" fill="#bae6fd" class="band" />
    <text x="50" y="100" class="text-label">CB</text>

    <!-- Few electrons in CB -->
    <circle cx="40" cy="120" r="3" fill="#111827"/><circle cx="60" cy="120" r="3" fill="#111827"/>
    
    <!-- Small Band Gap -->
    <line x1="50" y1="130" x2="50" y2="180" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" />
    <text x="120" y="160" class="text-label" fill="#2563eb" font-weight="bold">E_g &lt; 3 eV</text>

    <rect x="0" y="180" width="100" height="70" fill="#fca5a5" class="band" />
    <text x="50" y="210" class="text-label">VB</text>

    <!-- Electrons and holes in VB -->
    <circle cx="20" cy="230" r="3" fill="#111827"/><circle cx="40" cy="230" r="3" fill="#fff" stroke="#111827" stroke-width="1.5"/><circle cx="60" cy="230" r="3" fill="#fff" stroke="#111827" stroke-width="1.5"/><circle cx="80" cy="230" r="3" fill="#111827"/>
    <circle cx="20" cy="245" r="3" fill="#111827"/><circle cx="40" cy="245" r="3" fill="#111827"/><circle cx="60" cy="245" r="3" fill="#111827"/><circle cx="80" cy="245" r="3" fill="#111827"/>
  </g>

</svg>
