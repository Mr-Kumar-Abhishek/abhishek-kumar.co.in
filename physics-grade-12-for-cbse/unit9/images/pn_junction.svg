<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="400">
  <defs>
    <marker id="arrow" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 -5L10 0L0 5" fill="#111827"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" rx="10"/>

  <g transform="translate(250, 200)">
    <!-- Axes -->
    <!-- X axis (Voltage) -->
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)" />
    <text x="230" y="5" font-family="sans-serif" font-size="14" fill="#111827">V (Volts)</text>
    
    <!-- Y axis (Current) -->
    <line x1="0" y1="180" x2="0" y2="-180" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)" />
    <text x="10" y="-180" font-family="sans-serif" font-size="14" fill="#111827">I (mA)</text>
    <text x="10" y="175" font-family="sans-serif" font-size="14" fill="#111827">I (μA)</text>
    
    <text x="-15" y="15" font-family="sans-serif" font-size="14" fill="#111827">0</text>

    <!-- Forward Bias Graph (Quadrant I) -->
    <!-- Threshold voltage ~ 0.7 V. Let's make 1V = 100px. So 0.7V = 70px -->
    <path d="M 0 0 L 60 0 C 80 -10, 90 -50, 100 -160" fill="none" stroke="#2563eb" stroke-width="3" />
    
    <!-- Threshold voltage mark -->
    <line x1="70" y1="-5" x2="70" y2="5" stroke="#374151" stroke-width="1.5" />
    <text x="70" y="20" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle">V_th (0.7V for Si)</text>
    <text x="120" y="-100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Forward Bias</text>

    <!-- Reverse Bias Graph (Quadrant III) -->
    <!-- Very small saturation current, then breakdown. Breakdown V_z = -10V. Let's make 1V = 10px here for visual scale. -->
    <path d="M 0 0 C -20 10, -50 15, -150 15 Q -160 15, -165 140" fill="none" stroke="#ef4444" stroke-width="3" />

    <!-- Breakdown voltage mark -->
    <line x1="-160" y1="-5" x2="-160" y2="5" stroke="#374151" stroke-width="1.5" />
    <text x="-160" y="-10" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle">-V_z</text>
    <text x="-170" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="end">Reverse Bias</text>
    <text x="-170" y="120" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="end">(Breakdown)</text>

  </g>
</svg>
