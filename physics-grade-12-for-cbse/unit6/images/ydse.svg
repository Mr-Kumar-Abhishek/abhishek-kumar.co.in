<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="300">
  <defs>
    <style>
      .wave { fill: none; stroke: #3b82f6; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .solid { fill: none; stroke: #ef4444; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" rx="10"/>

  <!-- Light Source -->
  <circle cx="20" cy="150" r="5" fill="#f59e0b" />
  <text x="20" y="170" fill="#111827" font-family="sans-serif" font-size="16" text-anchor="middle">S</text>
  
  <!-- Primary Wavefronts -->
  <path d="M 40 130 Q 50 150 40 170" class="solid" />
  <path d="M 60 110 Q 80 150 60 190" class="solid" />

  <!-- Double Slit plane -->
  <line x1="100" y1="20" x2="100" y2="100" stroke="#111827" stroke-width="4" />
  <line x1="100" y1="120" x2="100" y2="180" stroke="#111827" stroke-width="4" />
  <line x1="100" y1="200" x2="100" y2="280" stroke="#111827" stroke-width="4" />

  <!-- Slit Labels -->
  <text x="80" y="115" fill="#111827" font-family="sans-serif" font-size="16" font-weight="bold">S₁</text>
  <text x="80" y="195" fill="#111827" font-family="sans-serif" font-size="16" font-weight="bold">S₂</text>
  <text x="120" y="155" fill="#374151" font-family="sans-serif" font-size="16">d</text>
  <line x1="110" y1="110" x2="110" y2="190" stroke="#374151" stroke-width="1.5" />

  <!-- Screen -->
  <line x1="400" y1="20" x2="400" y2="280" stroke="#1f2937" stroke-width="6" />
  <text x="415" y="155" fill="#111827" font-family="sans-serif" font-size="16">O (Central Max)</text>
  <text x="415" y="65" fill="#111827" font-family="sans-serif" font-size="16">P</text>

  <!-- Distance D -->
  <line x1="100" y1="280" x2="400" y2="280" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2,2" />
  <text x="250" y="275" fill="#111827" font-family="sans-serif" font-size="16">D</text>

  <!-- Rays from slits to P -->
  <line x1="100" y1="110" x2="400" y2="60" stroke="#ef4444" stroke-width="2" />
  <line x1="100" y1="190" x2="400" y2="60" stroke="#3b82f6" stroke-width="2" />

  <!-- Central axis -->
  <line x1="100" y1="150" x2="400" y2="150" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,5" />
  
  <!-- Distance y -->
  <line x1="410" y1="60" x2="410" y2="150" stroke="#6b7280" stroke-width="1.5" />
  <text x="395" y="110" fill="#111827" font-family="sans-serif" font-size="16">y</text>

  <!-- Perpendicular for Path Difference -->
  <line x1="100" y1="110" x2="135" y2="180" stroke="#111827" stroke-width="1.5" stroke-dasharray="2,2" />
  <text x="145" y="205" fill="#111827" font-family="sans-serif" font-size="14">Δx</text>
</svg>
