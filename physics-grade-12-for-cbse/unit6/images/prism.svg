<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="400">
  <defs>
    <marker id="arrow" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 -5L10 0L0 5" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" rx="10"/>

  <!-- Prism -->
  <polygon points="250,50 100,300 400,300" fill="#ccfbff" stroke="#00b4d8" stroke-width="2" fill-opacity="0.3"/>
  <text x="250" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">A</text>
  <text x="80" y="315" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">B</text>
  <text x="420" y="315" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">C</text>

  <!-- Surface Normals (Dotted) -->
  <!-- Normal 1 at Left Face (100,300 to 250,50 -> normal slope angle) -->
  <line x1="80" y1="130" x2="230" y2="220" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5" />
  <text x="75" y="125" font-family="sans-serif" font-size="14" fill="#374151">N₁</text>

  <!-- Normal 2 at Right Face (250,50 to 400,300 -> normal slope angle) -->
  <line x1="420" y1="130" x2="270" y2="220" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5" />
  <text x="425" y="125" font-family="sans-serif" font-size="14" fill="#374151">N₂</text>

  <!-- Incident Ray -->
  <!-- Starts left, hits face AB at (160, 150) -->
  <line x1="20" y1="200" x2="160" y2="150" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="20" y1="200" x2="90" y2="175" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />
  <text x="50" y="195" font-family="sans-serif" font-size="16" fill="#111827">Incident Ray</text>

  <!-- Refracted Ray (inside prism) -->
  <!-- Travels from (160,150) to (340,150) -->
  <line x1="160" y1="150" x2="340" y2="150" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Emergent Ray -->
  <!-- Travels from (340,150) to (480,200) -->
  <line x1="340" y1="150" x2="480" y2="200" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />
  <text x="390" y="195" font-family="sans-serif" font-size="16" fill="#111827">Emergent Ray</text>

  <!-- Extend incident and emergent rays to show angle of deviation -->
  <!-- Ext incident ray (160, 150) to (300, 100) along same slope -->
  <line x1="160" y1="150" x2="300" y2="100" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" />
  <!-- Ext emergent ray back from (340, 150) to (200, 100) along same slope -->
  <line x1="340" y1="150" x2="200" y2="100" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Angles -->
  <!-- i -->
  <path d="M 130 140 A 25 25 0 0 0 145 165" fill="none" stroke="#111827" stroke-width="1.5"/>
  <text x="125" y="165" font-family="sans-serif" font-size="16" font-style="italic" fill="#111827">i</text>
  
  <!-- e -->
  <path d="M 370 140 A 25 25 0 0 1 355 165" fill="none" stroke="#111827" stroke-width="1.5"/>
  <text x="370" y="165" font-family="sans-serif" font-size="16" font-style="italic" fill="#111827">e</text>
  
  <!-- delta (Deviation) at intersection (250, 118) -->
  <path d="M 270 110 A 20 20 0 0 1 270 125" fill="none" stroke="#111827" stroke-width="1.5"/>
  <text x="280" y="125" font-family="sans-serif" font-size="18" fill="#111827">δ</text>
  
  <text x="250" y="360" font-family="sans-serif" font-size="20" fill="#111827" text-anchor="middle">Refraction through a Glass Prism</text>
</svg>
