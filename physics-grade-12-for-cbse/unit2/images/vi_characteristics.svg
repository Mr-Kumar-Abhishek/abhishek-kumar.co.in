<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 250" width="100%" height="250">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" rx="10"/>

  <!-- Left Graph (Ohmic) -->
  <g transform="translate(50, 200)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="160" y2="0" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="0" y1="0" x2="0" y2="-160" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Ohmic Line -->
    <line x1="0" y1="0" x2="130" y2="-130" stroke="#3b82f6" stroke-width="3" />
    
    <!-- Labels -->
    <text x="165" y="5" font-family="sans-serif" font-size="14" fill="#111827">V (volts)</text>
    <text x="-5" y="-170" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle">I (amp)</text>
    <text x="-10" y="15" font-family="sans-serif" font-size="14" fill="#111827">0</text>
    <text x="65" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Ohmic Conductor</text>
  </g>

  <!-- Right Graph (Non-Ohmic / Diode) -->
  <g transform="translate(300, 200)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="160" y2="0" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="0" y1="0" x2="0" y2="-160" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Non-Ohmic Curve (exponential) -->
    <path d="M 0 0 C 80 -10, 110 -30, 130 -140" fill="none" stroke="#ef4444" stroke-width="3" />
    
    <!-- Labels -->
    <text x="165" y="5" font-family="sans-serif" font-size="14" fill="#111827">V (volts)</text>
    <text x="-5" y="-170" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle">I (mA)</text>
    <text x="-10" y="15" font-family="sans-serif" font-size="14" fill="#111827">0</text>
    <text x="65" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Non-Ohmic (Diode)</text>
  </g>
</svg>
