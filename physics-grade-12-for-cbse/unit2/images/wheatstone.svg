<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="400">
  <defs>
    <!-- Resistor symbol -->
    <g id="resistor">
      <path d="M 0 0 L 10 0 L 15 -10 L 25 10 L 35 -10 L 45 10 L 55 -10 L 60 0 L 70 0" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <!-- Galvanometer symbol -->
    <g id="galvanometer">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#374151" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#374151">G</text>
      <circle cx="0" cy="0" r="20" fill="#fca5a5" fill-opacity="0.1" />
    </g>
    <!-- Battery symbol -->
    <g id="battery">
      <line x1="-10" y1="-20" x2="-10" y2="20" stroke="#374151" stroke-width="4" />
      <line x1="10" y1="-10" x2="10" y2="10" stroke="#374151" stroke-width="6" />
      <line x1="-10" y1="0" x2="-30" y2="0" stroke="#374151" stroke-width="2" />
      <line x1="10" y1="0" x2="30" y2="0" stroke="#374151" stroke-width="2" />
    </g>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" rx="10"/>

  <!-- Bridge Diamond -->
  <!-- Top node A (250, 50), Left node B (100, 200), Right node C (400, 200), Bottom node D (250, 350) -->
  
  <g stroke="#374151" stroke-width="2">
    <!-- Wires connecting nodes to battery -->
    <line x1="100" y1="200" x2="50" y2="200" />
    <line x1="50" y1="200" x2="50" y2="350" />
    <line x1="50" y1="350" x2="150" y2="350" />
    
    <line x1="400" y1="200" x2="450" y2="200"/>
    <line x1="450" y1="200" x2="450" y2="350"/>
    <line x1="450" y1="350" x2="210" y2="350"/>
    
    <!-- Wire to Galvanometer -->
    <line x1="250" y1="50" x2="250" y2="180" />
    <line x1="250" y1="220" x2="250" y2="350" />

    <!-- Diamond Arms -->
    <!-- AB -->
    <line x1="100" y1="200" x2="140" y2="160" />
    <g transform="translate(140,160) rotate(-45)"><use href="#resistor"/></g>
    <line x1="190" y1="110" x2="250" y2="50" />

    <!-- AD -->
    <line x1="100" y1="200" x2="140" y2="240" />
    <g transform="translate(140,240) rotate(45)"><use href="#resistor"/></g>
    <line x1="190" y1="290" x2="250" y2="350" />

    <!-- BC -->
    <line x1="250" y1="50" x2="310" y2="110" />
    <g transform="translate(310,110) rotate(45)"><use href="#resistor"/></g>
    <line x1="360" y1="160" x2="400" y2="200" />

    <!-- CD -->
    <line x1="250" y1="350" x2="310" y2="290" />
    <g transform="translate(310,290) rotate(-45)"><use href="#resistor"/></g>
    <line x1="360" y1="240" x2="400" y2="200" />
  </g>

  <!-- Key -->
  <line x1="150" y1="350" x2="170" y2="350" stroke="#374151" stroke-width="2" />
  <line x1="170" y1="350" x2="180" y2="330" stroke="#374151" stroke-width="2" />
  <text x="175" y="325" font-family="sans-serif" font-size="16" fill="#374151" font-weight="bold">K</text>
  
  <!-- The Battery -->
  <g transform="translate(195, 350)"><use href="#battery"/></g>
  <text x="195" y="380" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#374151" font-weight="bold">V</text>

  <!-- The Galvanometer -->
  <g transform="translate(250, 200)"><use href="#galvanometer"/></g>

  <!-- Labels -->
  <text x="250" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111827">A</text>
  <text x="85" y="205" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111827">B</text>
  <text x="415" y="205" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111827">C</text>
  <text x="250" y="375" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111827">D</text>
  
  <text x="150" y="125" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2563eb">P</text>
  <text x="350" y="125" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2563eb">Q</text>
  <text x="150" y="285" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2563eb">R</text>
  <text x="350" y="285" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2563eb">S</text>

  <circle cx="250" cy="50" r="4" fill="#374151" />
  <circle cx="100" cy="200" r="4" fill="#374151" />
  <circle cx="400" cy="200" r="4" fill="#374151" />
  <circle cx="250" cy="350" r="4" fill="#374151" />

</svg>
