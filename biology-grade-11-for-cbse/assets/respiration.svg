<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #1565c0; text-anchor: middle; }
      .label { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #fff; text-anchor: middle; }
      .text-dark { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .line { stroke: #333; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .path-atp { stroke: #ff9800; stroke-width: 3; fill: none; marker-end: url(#arrowhead-atp); }
      .path-nadh { stroke: #e91e63; stroke-width: 3; fill: none; stroke-dasharray: 5,5; marker-end: url(#arrowhead-nadh); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead-atp" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9800" />
    </marker>
    <marker id="arrowhead-nadh" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e91e63" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#e3f2fd" rx="15"/>
  <text x="400" y="40" class="title">Overview of Cellular Respiration</text>

  <!-- Regions -->
  <rect x="50" y="80" width="250" height="480" fill="#bbdefb" rx="10"/>
  <text x="175" y="110" class="text-dark">Cytoplasm</text>

  <rect x="350" y="80" width="400" height="480" fill="#ffcdd2" rx="10"/>
  <text x="550" y="110" class="text-dark">Mitochondrion</text>

  <!-- Stage 1: Glycolysis -->
  <rect x="100" y="150" width="150" height="60" rx="10" fill="#1976d2"/>
  <text x="175" y="186" class="label">Glycolysis</text>
  <text x="175" y="130" class="text-dark">Glucose (6C)</text>
  <path d="M 175 135 L 175 145" class="line"/>
  
  <text x="215" y="240" class="text-dark" text-anchor="start">2 Pyruvate (3C)</text>
  <path d="M 175 210 L 175 260" class="line"/>

  <!-- ATP from Glycolysis -->
  <path d="M 100 180 Q 30 180 30 300 L 30 520 L 350 520" class="path-atp"/>
  <text x="45" y="280" class="text-dark" fill="#ff9800" text-anchor="start">2 ATP</text>

  <!-- NADH from Glycolysis -->
  <path d="M 250 180 Q 320 180 320 300 L 320 440 L 610 440" class="path-nadh"/>
  <text x="325" y="250" class="text-dark" fill="#e91e63" text-anchor="start">2 NADH</text>

  <!-- Transport into Mitochondria -->
  <path d="M 175 260 L 415 260" class="line"/>

  <!-- Link Reaction -->
  <rect x="415" y="235" width="130" height="50" rx="10" fill="#d32f2f"/>
  <text x="480" y="265" class="label" font-size="14">Link Reaction</text>
  
  <path d="M 480 285 L 480 310" class="line"/>
  <!-- NADH from Link Reaction -->
  <path d="M 545 260 Q 580 260 580 320 L 580 460 L 610 460" class="path-nadh"/>
  <text x="585" y="300" class="text-dark" fill="#e91e63">2 NADH</text>
  <text x="495" y="305" class="text-dark">Acetyl CoA (2C)</text>

  <!-- Krebs Cycle -->
  <circle cx="480" cy="350" r="50" fill="#d32f2f"/>
  <text x="480" y="345" class="label" font-size="14">Krebs</text>
  <text x="480" y="365" class="label" font-size="14">Cycle</text>

  <!-- ATP from Krebs -->
  <path d="M 430 350 Q 360 350 360 520" class="path-atp"/>
  <text x="365" y="340" class="text-dark" fill="#ff9800" text-anchor="end">2 ATP</text>

  <!-- NADH/FADH2 from Krebs -->
  <path d="M 530 350 Q 640 350 640 430" class="path-nadh"/>
  <text x="645" y="350" class="text-dark" fill="#e91e63" text-anchor="start">6 NADH + 2 FADH&#8322;</text>

  <!-- CO2 Release -->
  <path d="M 415 250 L 360 220" class="line"/>
  <text x="375" y="215" class="text-dark">CO&#8322;</text>
  <path d="M 440 320 L 360 290" class="line"/>
  <text x="375" y="285" class="text-dark">CO&#8322;</text>

  <!-- ETS / OXPHOS -->
  <rect x="595" y="430" width="145" height="60" rx="10" fill="#d32f2f"/>
  <text x="667" y="455" class="label" font-size="13">Electron Transport</text>
  <text x="667" y="475" class="label" font-size="13">Chain (ETS)</text>

  <!-- O2 / H2O -->
  <path d="M 750 440 L 730 450" class="line"/>
  <text x="760" y="440" class="text-dark">O&#8322;</text>
  <path d="M 670 490 L 670 520" class="line"/>
  <text x="670" y="540" class="text-dark">H&#8322;O</text>

  <!-- Massive ATP from ETS -->
  <path d="M 610 480 Q 550 500 480 500 L 400 500" class="path-atp"/>
  <text x="500" y="520" class="text-dark" fill="#ff9800" font-size="18">~32-34 ATP</text>

</svg>
