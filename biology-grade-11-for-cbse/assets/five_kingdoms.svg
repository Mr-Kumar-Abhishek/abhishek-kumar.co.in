<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <!-- Gradients for Kingdoms -->
    <linearGradient id="gradMonera" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E65100;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradProtista" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradFungi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A148C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradPlantae" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradAnimalia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
    
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #333; }
      .kingdom-title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: white; text-anchor: middle; }
      .desc { font-family: 'Arial', sans-serif; font-size: 14px; fill: white; text-anchor: middle; }
      .meta { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #555; text-anchor: middle; }
      .arrow { stroke: #666; stroke-width: 3; fill: none; stroke-dasharray: 5,5; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f4f4f9" rx="15"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" class="title">R.H. Whittaker's Five Kingdom Classification</text>

  <!-- Level 1: Prokaryotes -->
  <text x="400" y="450" class="meta">Prokaryotic</text>
  <rect x="300" y="350" width="200" height="80" rx="10" fill="url(#gradMonera)"/>
  <text x="400" y="380" class="kingdom-title">MONERA</text>
  <text x="400" y="405" class="desc">Unicellular Bacteria</text>
  
  <line x1="400" y1="350" x2="400" y2="300" stroke="#666" stroke-width="3"/>

  <!-- Level 2: Eukaryotes Unicellular -->
  <text x="700" y="260" class="meta">Eukaryotic</text>
  <text x="700" y="280" class="meta">Unicellular</text>
  <rect x="300" y="220" width="200" height="80" rx="10" fill="url(#gradProtista)"/>
  <text x="400" y="250" class="kingdom-title">PROTISTA</text>
  <text x="400" y="275" class="desc">Amoeba, Paramecium</text>

  <!-- Splitting Lines for Multicellular -->
  <path d="M 400 220 L 400 180" stroke="#666" stroke-width="3"/>
  <path d="M 175 180 L 625 180" stroke="#666" stroke-width="3"/>
  
  <path d="M 175 180 L 175 150" stroke="#666" stroke-width="3"/>
  <path d="M 400 180 L 400 150" stroke="#666" stroke-width="3"/>
  <path d="M 625 180 L 625 150" stroke="#666" stroke-width="3"/>

  <text x="700" y="100" class="meta">Multicellular</text>

  <!-- Level 3: Multicellular Eukaryotes -->
  <!-- Plantae -->
  <rect x="75" y="70" width="200" height="80" rx="10" fill="url(#gradPlantae)"/>
  <text x="175" y="100" class="kingdom-title">PLANTAE</text>
  <text x="175" y="125" class="desc">Autotrophs</text>

  <!-- Fungi -->
  <rect x="300" y="70" width="200" height="80" rx="10" fill="url(#gradFungi)"/>
  <text x="400" y="100" class="kingdom-title">FUNGI</text>
  <text x="400" y="125" class="desc">Saprophytes</text>

  <!-- Animalia -->
  <rect x="525" y="70" width="200" height="80" rx="10" fill="url(#gradAnimalia)"/>
  <text x="625" y="100" class="kingdom-title">ANIMALIA</text>
  <text x="625" y="125" class="desc">Heterotrophs</text>

</svg>
