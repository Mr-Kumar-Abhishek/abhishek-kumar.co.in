<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #333; text-anchor: middle; }
      .label { font-family: 'Arial', sans-serif; font-size: 14px; fill: #444; text-anchor: middle; }
      .axis { stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrow); }
      .curve-arith { fill: none; stroke: #1976d2; stroke-width: 3; }
      .curve-geo { fill: none; stroke: #d32f2f; stroke-width: 3; }
      .curve-sig { fill: none; stroke: #388e3c; stroke-width: 3; stroke-dasharray: 6,4; }
      .text-annotation { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c3e50" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#fafafa" rx="10"/>

  <text x="400" y="30" class="title">Arithmetic vs. Geometric Growth</text>

  <!-- Split into two graphs -->
  <!-- Graph 1: Arithmetic Growth -->
  <g transform="translate(50, 50)">
    <!-- Axes -->
    <line x1="40" y1="280" x2="40" y2="40" class="axis"/>
    <text x="15" y="160" transform="rotate(-90 15 160)" class="label">Size / Length (L)</text>
    <line x1="40" y1="280" x2="300" y2="280" class="axis"/>
    <text x="170" y="315" class="label">Time (t)</text>

    <!-- Plot y = mx + c -->
    <path d="M 40 250 L 250 80" class="curve-arith"/>

    <!-- Annotations -->
    <text x="170" y="60" class="text-annotation" fill="#1976d2" text-anchor="middle">Arithmetic Growth</text>
    <text x="170" y="80" class="label" fill="#1976d2">L_t = L_0 + rt</text>
  </g>

  <!-- Graph 2: Geometric & Sigmoid Growth -->
  <g transform="translate(450, 50)">
    <!-- Axes -->
    <line x1="40" y1="280" x2="40" y2="40" class="axis"/>
    <text x="15" y="160" transform="rotate(-90 15 160)" class="label">Size / Weight (W)</text>
    <line x1="40" y1="280" x2="300" y2="280" class="axis"/>
    <text x="170" y="315" class="label">Time (t)</text>

    <!-- Exponential Plot y = e^x -->
    <path d="M 40 270 Q 180 260 220 50" class="curve-geo"/>

    <!-- Sigmoid curve (Logistic) -->
    <path d="M 40 270 C 140 260, 160 100, 260 80 L 280 80" class="curve-sig"/>

    <!-- Annotations -->
    <text x="120" y="50" class="text-annotation" fill="#d32f2f">Exponential</text>
    <text x="120" y="70" class="label" fill="#d32f2f">W_t = W_0 e^rt</text>

    <text x="240" y="120" class="text-annotation" fill="#388e3c">Sigmoid (Logistic)</text>
    
    <!-- Phases Annotation -->
    <text x="80" y="220" class="label" font-size="12">Lag</text>
    <text x="150" y="180" class="label" font-size="12" transform="rotate(-45 150 180)">Log/Exp</text>
    <text x="230" y="65" class="label" font-size="12">Stationary</text>
  </g>

</svg>
