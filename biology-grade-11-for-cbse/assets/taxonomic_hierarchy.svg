<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <marker id="triangle" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
    <style>
      .text-label { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: white; }
      .subtext { font-family: 'Arial', sans-serif; font-size: 12px; fill: white; font-style: italic; }
      .box { rx: 10; ry: 10; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f9f9f9"/>

  <!-- Kingdom -->
  <rect x="100" y="30" width="200" height="50" class="box" fill="url(#grad1)"/>
  <text x="200" y="60" text-anchor="middle" class="text-label">Kingdom</text>

  <!-- Line -->
  <line x1="200" y1="80" x2="200" y2="100" stroke="#2E7D32" stroke-width="3"/>

  <!-- Phylum -->
  <rect x="110" y="100" width="180" height="50" class="box" fill="url(#grad1)"/>
  <text x="200" y="130" text-anchor="middle" class="text-label">Phylum / Division</text>

  <!-- Line -->
  <line x1="200" y1="150" x2="200" y2="170" stroke="#2E7D32" stroke-width="3"/>

  <!-- Class -->
  <rect x="120" y="170" width="160" height="50" class="box" fill="url(#grad1)"/>
  <text x="200" y="200" text-anchor="middle" class="text-label">Class</text>

  <!-- Line -->
  <line x1="200" y1="220" x2="200" y2="240" stroke="#2E7D32" stroke-width="3"/>

  <!-- Order -->
  <rect x="130" y="240" width="140" height="50" class="box" fill="url(#grad1)"/>
  <text x="200" y="270" text-anchor="middle" class="text-label">Order</text>

  <!-- Line -->
  <line x1="200" y1="290" x2="200" y2="310" stroke="#2E7D32" stroke-width="3"/>

  <!-- Family -->
  <rect x="140" y="310" width="120" height="50" class="box" fill="url(#grad1)"/>
  <text x="200" y="340" text-anchor="middle" class="text-label">Family</text>

  <!-- Line -->
  <line x1="200" y1="360" x2="200" y2="380" stroke="#2E7D32" stroke-width="3"/>

  <!-- Genus -->
  <rect x="150" y="380" width="100" height="50" class="box" fill="url(#grad1)"/>
  <text x="200" y="410" text-anchor="middle" class="text-label">Genus</text>

  <!-- Line -->
  <line x1="200" y1="430" x2="200" y2="450" stroke="#2E7D32" stroke-width="3"/>

  <!-- Species -->
  <rect x="160" y="450" width="80" height="50" class="box" fill="url(#grad1)"/>
  <text x="200" y="480" text-anchor="middle" class="text-label">Species</text>

  <!-- Context arrows and text to right side -->
  <path d="M 310,55 Q 360,250 310,475" fill="none" stroke="#666" stroke-width="2" marker-start="url(#triangle)" marker-end="url(#triangle)"/>
  <text x="350" y="260" font-family="Arial" font-size="14" fill="#666" style="writing-mode: vertical-rl; transform: rotate(180deg) translate(-360px, -260px);">Increasing specificity / decreasing similarity</text>

</svg>
