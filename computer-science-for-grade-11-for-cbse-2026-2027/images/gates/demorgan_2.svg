<svg xmlns="http://www.w3.org/2000/svg" width="500" height="150" viewBox="0 0 500 150">
    <text x="250" y="20" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Second Law: NOT (A OR B) = (NOT A) AND (NOT B)</text>
    
    <!-- Left Side: NOR Gate -->
    <g transform="translate(50, 50)">
        <text x="45" y="-10" font-family="Arial" font-size="14" text-anchor="middle">NOR Equivalent</text>
        <line x1="10" y1="30" x2="35" y2="30" stroke="black" stroke-width="2"/>
        <line x1="10" y1="50" x2="35" y2="50" stroke="black" stroke-width="2"/>
        
        <line x1="100" y1="40" x2="120" y2="40" stroke="black" stroke-width="2"/>
        <path d="M 30,20 Q 60,20 90,40 Q 60,60 30,60 Q 45,40 30,20" fill="none" stroke="black" stroke-width="2"/>
        <circle cx="95" cy="40" r="5" fill="none" stroke="black" stroke-width="2"/> <!-- Bubble -->
        
        <text x="0" y="34" font-family="Arial" font-size="12">A</text>
        <text x="0" y="54" font-family="Arial" font-size="12">B</text>
        <text x="125" y="44" font-family="Arial" font-size="12">Y</text>
    </g>

    <!-- Equal Sign -->
    <text x="250" y="95" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">=</text>

    <!-- Right Side: Bubbled AND Gate -->
    <g transform="translate(300, 50)">
        <text x="45" y="-10" font-family="Arial" font-size="14" text-anchor="middle">Bubbled AND</text>
        <line x1="10" y1="30" x2="25" y2="30" stroke="black" stroke-width="2"/>
        <line x1="10" y1="50" x2="25" y2="50" stroke="black" stroke-width="2"/>
        <!-- Bubbles at input of AND gate -->
        <circle cx="30" cy="30" r="5" fill="none" stroke="black" stroke-width="2"/>
        <circle cx="30" cy="50" r="5" fill="none" stroke="black" stroke-width="2"/>
        
        <line x1="85" y1="40" x2="105" y2="40" stroke="black" stroke-width="2"/>
        <path d="M 35,20 L 65,20 A 20,20 0 0,1 85,40 A 20,20 0 0,1 65,60 L 35,60 Z" fill="none" stroke="black" stroke-width="2"/>
        
        <text x="0" y="34" font-family="Arial" font-size="12">A</text>
        <text x="0" y="54" font-family="Arial" font-size="12">B</text>
        <text x="110" y="44" font-family="Arial" font-size="12">Y</text>
    </g>
</svg>
