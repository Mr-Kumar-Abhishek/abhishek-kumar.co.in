<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230">
    <!-- NAND Gate -->
    <g transform="translate(10, 10)">
        <text x="0" y="10" font-family="Arial" font-size="14" font-weight="bold">NAND Gate</text>
        <line x1="10" y1="30" x2="30" y2="30" stroke="black" stroke-width="2"/>
        <line x1="10" y1="50" x2="30" y2="50" stroke="black" stroke-width="2"/>
        <line x1="95" y1="40" x2="115" y2="40" stroke="black" stroke-width="2"/>
        <path d="M 30,20 L 60,20 A 20,20 0 0,1 80,40 A 20,20 0 0,1 60,60 L 30,60 Z" fill="none" stroke="black" stroke-width="2"/>
        <circle cx="85" cy="40" r="5" fill="none" stroke="black" stroke-width="2"/>
        <text x="0" y="34" font-family="Arial" font-size="12">A</text>
        <text x="0" y="54" font-family="Arial" font-size="12">B</text>
        <text x="120" y="44" font-family="Arial" font-size="12">Y</text>
    </g>

    <!-- NOR Gate -->
    <g transform="translate(10, 80)">
        <text x="0" y="10" font-family="Arial" font-size="14" font-weight="bold">NOR Gate</text>
        <line x1="10" y1="30" x2="35" y2="30" stroke="black" stroke-width="2"/>
        <line x1="10" y1="50" x2="35" y2="50" stroke="black" stroke-width="2"/>
        <line x1="100" y1="40" x2="120" y2="40" stroke="black" stroke-width="2"/>
        <path d="M 30,20 Q 60,20 90,40 Q 60,60 30,60 Q 45,40 30,20" fill="none" stroke="black" stroke-width="2"/>
        <circle cx="95" cy="40" r="5" fill="none" stroke="black" stroke-width="2"/>
        <text x="0" y="34" font-family="Arial" font-size="12">A</text>
        <text x="0" y="54" font-family="Arial" font-size="12">B</text>
        <text x="125" y="44" font-family="Arial" font-size="12">Y</text>
    </g>

    <!-- XOR Gate -->
    <g transform="translate(10, 150)">
        <text x="0" y="10" font-family="Arial" font-size="14" font-weight="bold">XOR Gate</text>
        <line x1="10" y1="30" x2="35" y2="30" stroke="black" stroke-width="2"/>
        <line x1="10" y1="50" x2="35" y2="50" stroke="black" stroke-width="2"/>
        <line x1="90" y1="40" x2="110" y2="40" stroke="black" stroke-width="2"/>
        <path d="M 23,20 Q 38,40 23,60" fill="none" stroke="black" stroke-width="2"/>
        <path d="M 30,20 Q 60,20 90,40 Q 60,60 30,60 Q 45,40 30,20" fill="none" stroke="black" stroke-width="2"/>
        <text x="0" y="34" font-family="Arial" font-size="12">A</text>
        <text x="0" y="54" font-family="Arial" font-size="12">B</text>
        <text x="115" y="44" font-family="Arial" font-size="12">Y</text>
    </g>
</svg>
