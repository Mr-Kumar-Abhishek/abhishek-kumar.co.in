<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="auto">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b3d9ff" />
      <stop offset="100%" stop-color="#66b3ff" />
    </linearGradient>
    <linearGradient id="acrosomeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcc66" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <linearGradient id="midpieceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9999" />
      <stop offset="100%" stop-color="#ff4d4d" />
    </linearGradient>
  </defs>

  <rect width="800" height="300" fill="#fcfcfc" />

  <g transform="translate(100, 150)">
    <!-- Flagellum (Tail) -->
    <!-- The tail is long and wavy -->
    <path d="M220,0 Q300,-40 380,0 Q460,40 540,0 Q620,-40 680,0" fill="none" stroke="#66b3ff" stroke-width="4" />
    
    <!-- Axial filament inside tail -->
    <path d="M220,0 Q300,-40 380,0 Q460,40 540,0 Q620,-40 680,0" fill="none" stroke="#004080" stroke-width="1" />

    <!-- Middle Piece -->
    <rect x="120" y="-12" width="100" height="24" rx="8" fill="url(#midpieceGrad)" />
    
    <!-- Mitochondria (spiral around axial filament in middle piece) -->
    <!-- Drawing zigzag to represent the spiral -->
    <path d="M125,-12 L135,12 L145,-12 L155,12 L165,-12 L175,12 L185,-12 L195,12 L205,-12 L215,12" fill="none" stroke="#cc0000" stroke-width="3" opacity="0.8"/>

    <!-- Neck -->
    <rect x="100" y="-8" width="20" height="16" fill="#cccccc" />
    <!-- Centrioles in neck -->
    <circle cx="110" cy="-4" r="3" fill="#333" />
    <circle cx="110" cy="4" r="3" fill="#333" />

    <!-- Head -->
    <path d="M100,-25 C50,-25 0,-15 0,0 C0,15 50,25 100,25 Z" fill="url(#headGrad)" stroke="#004080" stroke-width="2" />
    
    <!-- Nucleus -->
    <path d="M90,-18 C50,-18 20,-10 20,0 C20,10 50,18 90,18 Z" fill="#0066cc" opacity="0.6" />
    <text x="50" y="5" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Nucleus</text>

    <!-- Acrosome -->
    <path d="M40,-20 C10,-15 0,-5 0,0 C0,5 10,15 40,20 C15,10 15,-10 40,-20 Z" fill="url(#acrosomeGrad)" stroke="#cc7a00" stroke-width="1" />
  </g>

  <!-- Labels & Pointers -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#333">
    <!-- Plasma Membrane -->
    <line x1="150" y1="125" x2="100" y2="80" stroke="#333" stroke-width="1" stroke-dasharray="4" />
    <text x="40" y="70">Plasma membrane</text>

    <!-- Acrosome -->
    <line x1="120" y1="150" x2="100" y2="100" stroke="#333" stroke-width="1" stroke-dasharray="4" />
    <text x="40" y="90">Acrosome</text>

    <!-- Nucleus -->
    <line x1="150" y1="150" x2="150" y2="115" stroke="#333" stroke-width="1" stroke-dasharray="4" />
    <text x="125" y="105">Nucleus</text>

    <!-- Head Bracket -->
    <path d="M100,180 L100,200 L200,200 L200,180" fill="none" stroke="#333" stroke-width="2" />
    <text x="135" y="220" font-weight="bold">Head</text>

    <!-- Neck -->
    <line x1="210" y1="145" x2="210" y2="110" stroke="#333" stroke-width="1" stroke-dasharray="4" />
    <text x="195" y="100">Neck</text>

    <!-- Middle Piece Bracket -->
    <path d="M220,180 L220,200 L320,200 L320,180" fill="none" stroke="#333" stroke-width="2" />
    <text x="230" y="220" font-weight="bold">Middle Piece</text>

    <!-- Mitochondria -->
    <line x1="280" y1="140" x2="300" y2="100" stroke="#333" stroke-width="1" stroke-dasharray="4" />
    <text x="250" y="90">Mitochondria</text>

    <!-- Tail Bracket -->
    <path d="M320,180 L320,200 L760,200 L760,180" fill="none" stroke="#333" stroke-width="2" />
    <text x="520" y="220" font-weight="bold">Tail</text>
  </g>

  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Structure of a Human Sperm</text>
</svg>
